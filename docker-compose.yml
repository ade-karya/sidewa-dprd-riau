services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sidewa}
      POSTGRES_USER: ${POSTGRES_USER:-sidewa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD di .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SIDEWA_ENV: production
      # Mode mandiri: database ikut container ``db`` di bawah.
      # Untuk memakai Supabase langsung, hapus baris ini agar nilai
      # SIDEWA_DATABASE_URL dari .env (transaction pooler) yang dipakai.
      SIDEWA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sidewa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sidewa}
      SIDEWA_MEDIA_ROOT: /app/data/media
      SIDEWA_COOKIE_SECURE: "true"
      SIDEWA_TRUSTED_HOSTS: ${SIDEWA_TRUSTED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - media_data:/app/data/media
      # Opsional: berkas identitas anggota (dibuat dari data DB / manual).
      # Hapus baris ini bila berkas tidak tersedia di server.
      - ./data/member_identity.json:/app/data/member_identity.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - media_data:/var/www/media:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  media_data:
